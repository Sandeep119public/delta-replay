name: Correct Audited Accounting Hardening

on:
  push:
    branches: [audit-fix-margin-funding]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'audit fix applied')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Correct accounting hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/trading/PaperTradingEngine.js')
          s = p.read_text()

          # Preserve the existing public error code for compatibility while making the
          # admission decision against cross-margin availableMargin.
          s = s.replace("order.rejectionReason = 'INSUFFICIENT_MARGIN';", "order.rejectionReason = 'INSUFFICIENT_CASH';")
          s = s.replace("'INSUFFICIENT_MARGIN', `Insufficient available margin to fill MARKET", "'INSUFFICIENT_CASH', `Insufficient available margin to fill MARKET")
          s = s.replace("'INSUFFICIENT_MARGIN', `Insufficient available margin to fill ${side} limit", "'INSUFFICIENT_CASH', `Insufficient available margin to fill ${side} limit")
          s = s.replace("'INSUFFICIENT_MARGIN', `Insufficient available margin to fill STOP", "'INSUFFICIENT_CASH', `Insufficient available margin to fill STOP")
          s = s.replace("this._reject('INSUFFICIENT_MARGIN', `Insufficient available margin to place ${side} order", "this._reject('INSUFFICIENT_CASH', `Insufficient available margin to place ${side} order")

          # Explicit funding marks must not treat null as numeric zero.
          old = "      const explicitMark = Number(markPrice);\n      const resolvedMarkPrice = Number.isFinite(explicitMark) ? explicitMark : (Number.isFinite(pos.currentPrice) ? pos.currentPrice : pos.entryPrice);"
          new = "      const explicitMark = markPrice == null ? NaN : Number(markPrice);\n      const resolvedMarkPrice = Number.isFinite(explicitMark) ? explicitMark : (Number.isFinite(pos.currentPrice) ? pos.currentPrice : pos.entryPrice);"
          if old not in s:
              raise SystemExit('explicit funding mark block not found')
          s = s.replace(old, new, 1)

          # The previous pass inserted the funding helper into the block later replaced by
          # the liquidation rewrite. Insert it after the final liquidation method instead.
          if "  _fundingMarkPriceAt(symbol, timestamp, previousMarket, currentCandle) {" not in s:
              anchor = "\n  clearMarketContext() {\n"
              helper = """\n  _fundingMarkPriceAt(symbol, timestamp, previousMarket, currentCandle) {\n    const pos = this._positions.get(symbol);\n    if (!pos) return null;\n    const prevClose = previousMarket && Number.isFinite(previousMarket.candle?.close)\n      ? Number(previousMarket.candle.close)\n      : (Number.isFinite(pos.currentPrice) ? Number(pos.currentPrice) : Number(pos.entryPrice));\n    const currClose = Number.isFinite(currentCandle?.close) ? Number(currentCandle.close) : prevClose;\n    const prevTime = Number(previousMarket?.timestamp);\n    const currTime = Number(currentCandle?.time);\n    if (!Number.isFinite(prevTime) || !Number.isFinite(currTime) || currTime <= prevTime || timestamp <= prevTime) {\n      return timestamp >= currTime ? currClose : prevClose;\n    }\n    const ratio = Math.min(1, Math.max(0, (timestamp - prevTime) / (currTime - prevTime)));\n    return prevClose + (currClose - prevClose) * ratio;\n  }\n"""
              if anchor not in s:
                  raise SystemExit('clearMarketContext anchor not found for helper')
              s = s.replace(anchor, helper + anchor, 1)

          # Strengthen invariants with a cheap internal consistency check used by tests.
          marker = "  // Invariant checker for tests (Phase 9) — verifies equity = cash + unrealized, fees sum, etc.\n"
          invariant = """  _checkMarginInvariants() {\n    let expectedIM = 0;\n    let expectedMM = 0;\n    for (const pos of this._positions.values()) {\n      expectedIM += pos.initialMargin || 0;\n      expectedMM += pos.maintenanceMargin || 0;\n    }\n    const eps = 1e-9;\n    return {\n      usedMarginOk: Math.abs(this.account.usedMargin - expectedIM) < eps,\n      maintenanceMarginOk: Math.abs(this.account.maintenanceMargin - expectedMM) < eps,\n      equityOk: Math.abs(this.account.equity - (this.account.walletBalance + this.account.unrealizedPnL)) < eps,\n      availableMarginOk: Math.abs(this.account.availableMargin - Math.max(0, this.account.equity - this.account.usedMargin)) < eps,\n    };\n  }\n\n"""
          if marker in s and "_checkMarginInvariants()" not in s:
              s = s.replace(marker, invariant + marker, 1)
          p.write_text(s)

          r = Path('src/strategy/BacktestRunner.js').read_text()
          if 'const terminalOrders = pendingIntents.filter' not in r:
              old = """    const allOrders = this.engine.getOrders();\n    const pendingIntents = allOrders.filter(o => o.status === ORDER_STATUSES.PENDING);\n    return {\n      summary: {\n        ...this.engine.getBacktestSummary(),\n        unfilledTerminalOrders: pendingIntents.length,\n      },\n      trades: this.engine.getTrades(),\n      unfilledOrders: pendingIntents,\n"""
              new = """    const allOrders = this.engine.getOrders();\n    const pendingIntents = allOrders.filter(o => o.status === ORDER_STATUSES.PENDING);\n    const terminalIndex = this.engine._latestCandleIndex;\n    const terminalOrders = pendingIntents.filter(o => o.createdIndex === terminalIndex);\n    return {\n      summary: {\n        ...this.engine.getBacktestSummary(),\n        unfilledTerminalOrders: terminalOrders.length,\n      },\n      trades: this.engine.getTrades(),\n      unfilledOrders: pendingIntents,\n      unfilledTerminalOrders: terminalOrders,\n"""
              if old not in r:
                  raise SystemExit('BacktestRunner results block not found')
              Path('src/strategy/BacktestRunner.js').write_text(r.replace(old, new, 1))
          PY

          grep -n "_checkMarginAvailable" src/trading/PaperTradingEngine.js
          if grep -n "cashBalance < requiredCash" src/trading/PaperTradingEngine.js; then
            echo 'Legacy cash-only admission remains'
            exit 1
          fi

          cat > tests/audit-hardening.test.js <<'EOF'
          import { describe, it, expect } from 'vitest';
          import { PaperTradingEngine, EXECUTION_TIMING } from '../src/trading/PaperTradingEngine.js';
          import { Strategy } from '../src/strategy/Strategy.js';
          import { BacktestRunner } from '../src/strategy/BacktestRunner.js';

          const c = (time, open, high, low, close) => ({ time, open, high, low, close, volume: 1 });

          describe('Audited accounting hardening', () => {
            it('admits entries only against cross-margin availableMargin', () => {
              const e = new PaperTradingEngine({ startingBalance: 10000, feeRate: 0, marginRate: 0.1, maintMarginRate: 0.05, executionTiming: EXECUTION_TIMING.IMMEDIATE_CLOSE });
              e.onMarketCandle({ candle: c(0, 100, 100, 100, 100), index: 0, symbol: 'BTCUSD' });
              expect(e.placeOrder({ symbol: 'BTCUSD', side: 'BUY', quantity: 90 }).success).toBe(true);
              e.onMarketCandle({ candle: c(1, 50, 50, 50, 50), index: 1, symbol: 'ETHUSD' });
              const rejected = e.placeOrder({ symbol: 'ETHUSD', side: 'BUY', quantity: 220 }); // 11,000 notional -> 1,100 IM > 1,000 available
              expect(rejected.success).toBe(false);
              expect(rejected.code).toBe('INSUFFICIENT_CASH');
              expect(e.getAccountSnapshot().availableMargin).toBe(1000);
            });

            it('uses event-time interpolated marks for automatic funding boundaries', () => {
              const e = new PaperTradingEngine({ startingBalance: 10000, feeRate: 0, executionTiming: EXECUTION_TIMING.IMMEDIATE_CLOSE, fundingSchedule: { intervalSec: 28800, defaultRate: 0.001 } });
              e.onMarketCandle({ candle: c(60, 100, 100, 100, 100), index: 0, symbol: 'BTCUSD' });
              e.placeOrder({ symbol: 'BTCUSD', side: 'BUY', quantity: 10 });
              e.onMarketCandle({ candle: c(86460, 200, 200, 200, 200), index: 1, symbol: 'BTCUSD' });
              const h = e.getFundingHistory();
              expect(h.map(x => x.timestamp)).toEqual([28800, 57600, 86400]);
              expect(h[0].markPrice).toBeCloseTo(133.333333, 5);
              expect(h[1].markPrice).toBeCloseTo(166.666667, 5);
              expect(h[2].markPrice).toBeCloseTo(200, 5);
              expect(e.getAccountSnapshot().walletBalance).toBeCloseTo(9995, 8);
            });

            it('reports only terminal-bar pending orders as unfilledTerminalOrders', () => {
              class NoopStrategy extends Strategy { evaluate() { return []; } }
              const strategy = new NoopStrategy();
              const runner = new BacktestRunner({ strategy, symbol: 'BTCUSD', startingBalance: 10000, feeRate: 0, marginRate: 0.1, maintMarginRate: 0.05 });
              runner.run([c(0, 100, 100, 100, 100), c(60, 100, 100, 100, 100)]);
              const results = runner.getResults();
              expect(results.summary.unfilledTerminalOrders).toBe(0);
              expect(results.unfilledTerminalOrders).toHaveLength(0);
              runner.destroy();
            });
          });
          EOF

      - name: Verify
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit audited fixes
        shell: bash
        run: |
          rm -f .github/workflows/audit-fix.yml .github/workflows/audit-fix2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github/workflows/audit-fix.yml .github/workflows/audit-fix2.yml
          git diff --cached --check
          git commit -m "fix(accounting): audited cross-margin admission and funding marks"
          git push
