name: Audited Accounting Hardening

on:
  push:
    branches: [audit-fix-margin-funding]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'audit fix applied')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch accounting engine
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          engine_path = Path('src/trading/PaperTradingEngine.js')
          s = engine_path.read_text()

          # 1) Entry admission: every fill path must use cross-margin availableMargin.
          replacements = [
              ("""      const requiredCash = this._getRequiredEntryCash(filledPrice, qty);\n\n      if (this.account.cashBalance < requiredCash) {\n        order.status = ORDER_STATUSES.REJECTED;\n        order.rejectionReason = 'INSUFFICIENT_CASH';\n        this._emitOrderRejected(order, 'INSUFFICIENT_CASH', `Insufficient cash to fill MARKET: required ${requiredCash.toFixed(2)}, available ${this.account.cashBalance.toFixed(2)}`);\n        continue;\n      }\n""", """      const marginCheck = this._checkMarginAvailable(filledPrice, qty);\n      if (!marginCheck.valid) {\n        order.status = ORDER_STATUSES.REJECTED;\n        order.rejectionReason = 'INSUFFICIENT_MARGIN';\n        this._emitOrderRejected(order, 'INSUFFICIENT_MARGIN', `Insufficient available margin to fill MARKET: required ${marginCheck.requiredMargin.toFixed(2)}, available ${marginCheck.availableMargin.toFixed(2)}`);\n        continue;\n      }\n"""),
              ("""    const requiredCash = this._getRequiredEntryCash(filledPrice, qty);\n    if (this.account.cashBalance < requiredCash) {\n      order.status = ORDER_STATUSES.REJECTED;\n      order.rejectionReason = 'INSUFFICIENT_CASH';\n      this._emitOrderRejected(order, 'INSUFFICIENT_CASH', `Insufficient cash to fill ${side} limit: required ${requiredCash.toFixed(2)}, available ${this.account.cashBalance.toFixed(2)}`);\n      return { success: false, code: 'INSUFFICIENT_CASH' };\n    }\n""", """    const marginCheck = this._checkMarginAvailable(filledPrice, qty);\n    if (!marginCheck.valid) {\n      order.status = ORDER_STATUSES.REJECTED;\n      order.rejectionReason = 'INSUFFICIENT_MARGIN';\n      this._emitOrderRejected(order, 'INSUFFICIENT_MARGIN', `Insufficient available margin to fill ${side} limit: required ${marginCheck.requiredMargin.toFixed(2)}, available ${marginCheck.availableMargin.toFixed(2)}`);\n      return { success: false, code: 'INSUFFICIENT_MARGIN' };\n    }\n"""),
              ("""    const requiredCash = this._getRequiredEntryCash(filledPrice, qty);\n    if (this.account.cashBalance < requiredCash) {\n      order.status = ORDER_STATUSES.REJECTED;\n      order.rejectionReason = 'INSUFFICIENT_CASH';\n      this._emitOrderRejected(order, 'INSUFFICIENT_CASH', `Insufficient cash to fill STOP: required ${requiredCash.toFixed(2)}, available ${this.account.cashBalance.toFixed(2)}`);\n      return { success: false, code: 'INSUFFICIENT_CASH' };\n    }\n""", """    const marginCheck = this._checkMarginAvailable(filledPrice, qty);\n    if (!marginCheck.valid) {\n      order.status = ORDER_STATUSES.REJECTED;\n      order.rejectionReason = 'INSUFFICIENT_MARGIN';\n      this._emitOrderRejected(order, 'INSUFFICIENT_MARGIN', `Insufficient available margin to fill STOP: required ${marginCheck.requiredMargin.toFixed(2)}, available ${marginCheck.availableMargin.toFixed(2)}`);\n      return { success: false, code: 'INSUFFICIENT_MARGIN' };\n    }\n"""),
              ("""    const requiredCash = this._getRequiredEntryCash(execPrice, q);\n    if (this.account.cashBalance < requiredCash) {\n      return this._reject('INSUFFICIENT_CASH', `Insufficient cash to place ${side} order: required ${requiredCash.toFixed(2)}, available ${this.account.cashBalance.toFixed(2)}`);\n    }\n""", """    const marginCheck = this._checkMarginAvailable(execPrice, q);\n    if (!marginCheck.valid) {\n      return this._reject('INSUFFICIENT_MARGIN', `Insufficient available margin to place ${side} order: required ${marginCheck.requiredMargin.toFixed(2)}, available ${marginCheck.availableMargin.toFixed(2)}`);\n    }\n"""),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'Expected entry-admission block not found: {old[:80]!r}')
              s = s.replace(old, new, 1)

          # 2) Funding accepts an explicit event-time mark price.
          old_sig = "  applyFundingRate({ symbol = null, fundingRate = 0.0001, timestamp = null } = {}) {"
          new_sig = "  applyFundingRate({ symbol = null, fundingRate = 0.0001, timestamp = null, markPrice = null } = {}) {"
          if old_sig not in s:
              raise SystemExit('Funding signature not found')
          s = s.replace(old_sig, new_sig, 1)
          old_mark = "      const markPrice = Number.isFinite(pos.currentPrice) ? pos.currentPrice : pos.entryPrice;\n      const notional = markPrice * pos.quantity;"
          new_mark = "      const explicitMark = Number(markPrice);\n      const resolvedMarkPrice = Number.isFinite(explicitMark) ? explicitMark : (Number.isFinite(pos.currentPrice) ? pos.currentPrice : pos.entryPrice);\n      const notional = resolvedMarkPrice * pos.quantity;"
          if old_mark not in s:
              raise SystemExit('Funding mark block not found')
          s = s.replace(old_mark, new_mark, 1)
          s = s.replace("        markPrice,\n        fundingRate: rate,", "        markPrice: resolvedMarkPrice,\n        fundingRate: rate,", 1)

          # 3) Add deterministic funding mark interpolation helper.
          anchor = "  clearMarketContext() {\n"
          helper = """  _fundingMarkPriceAt(symbol, timestamp, previousMarket, currentCandle) {\n    const pos = this._positions.get(symbol);\n    if (!pos) return null;\n    const prevClose = previousMarket && Number.isFinite(previousMarket.candle?.close)\n      ? Number(previousMarket.candle.close)\n      : (Number.isFinite(pos.currentPrice) ? Number(pos.currentPrice) : Number(pos.entryPrice));\n    const currClose = Number.isFinite(currentCandle?.close) ? Number(currentCandle.close) : prevClose;\n    const prevTime = Number(previousMarket?.timestamp);\n    const currTime = Number(currentCandle?.time);\n    if (!Number.isFinite(prevTime) || !Number.isFinite(currTime) || currTime <= prevTime || timestamp <= prevTime) {\n      return timestamp >= currTime ? currClose : prevClose;\n    }\n    const ratio = Math.min(1, Math.max(0, (timestamp - prevTime) / (currTime - prevTime)));\n    return prevClose + (currClose - prevClose) * ratio;\n  }\n\n"""
          if anchor not in s:
              raise SystemExit('clearMarketContext anchor not found')
          s = s.replace(anchor, helper + anchor, 1)

          # 4) Replace liquidation trigger with an explicit portfolio equity-vs-maintenance check.
          start = s.index("  _processLiquidations(candle, candleIndex, symbol) {")
          end = s.index("\n  clearMarketContext() {", start)
          new_liq = """  _portfolioMarginStateAtPrice(symbol, markPrice) {\n    const imRate = (typeof this.marginRate === 'number' && this.marginRate >= 0) ? this.marginRate : 1.0;\n    const mmRate = (typeof this.maintMarginRate === 'number' && this.maintMarginRate >= 0) ? this.maintMarginRate : (imRate * 0.5);\n    let equity = this.account.walletBalance;\n    let maintenanceMargin = 0;\n\n    for (const [sym, pos] of this._positions.entries()) {\n      const mark = sym === symbol\n        ? markPrice\n        : (Number.isFinite(pos.currentPrice) ? pos.currentPrice : pos.entryPrice);\n      const unrealized = pos.side === 'LONG'\n        ? (mark - pos.entryPrice) * pos.quantity\n        : (pos.entryPrice - mark) * pos.quantity;\n      equity += unrealized;\n      maintenanceMargin += Math.abs(mark * pos.quantity) * mmRate;\n    }\n    return { equity, maintenanceMargin };\n  }\n\n  _isPortfolioLiquidatable(symbol, markPrice) {\n    const state = this._portfolioMarginStateAtPrice(symbol, markPrice);\n    return state.equity <= state.maintenanceMargin + 1e-9;\n  }\n\n  _processLiquidations(candle, candleIndex, symbol) {\n    const toLiquidate = [];\n    for (const [sym, pos] of this._positions.entries()) {\n      if (symbol && sym !== symbol) continue;\n      const adversePrice = pos.side === 'LONG' ? candle.low : candle.high;\n      if (!Number.isFinite(adversePrice)) continue;\n      if (!this._isPortfolioLiquidatable(sym, adversePrice)) continue;\n\n      const derivedPrice = this.getLiquidationPrice(sym);\n      let exitPrice = Number.isFinite(derivedPrice) && derivedPrice > 0 ? derivedPrice : adversePrice;\n      if (this.executionPolicy === EXECUTION_POLICY.REALISTIC && Number.isFinite(candle.open)) {\n        if (pos.side === 'LONG' && candle.open < exitPrice) exitPrice = candle.open;\n        if (pos.side === 'SHORT' && candle.open > exitPrice) exitPrice = candle.open;\n      }\n      toLiquidate.push({ symbol: sym, exitPrice, candleTime: candle.time, pos });\n    }\n\n    for (const item of toLiquidate) {\n      const { symbol: sym, exitPrice, candleTime, pos } = item;\n      this.emit(TradingEvents.POSITION_LIQUIDATED, {\n        symbol: sym,\n        liquidationPrice: exitPrice,\n        position: this._cloneJSON(pos.toJSON()),\n        candle: this._cloneJSON(candle),\n      });\n      this._closePositionInternal(sym, exitPrice, candleTime, 'LIQUIDATION');\n      this._cancelIncompatiblePendings(sym);\n    }\n  }\n"""
          s = s[:start] + new_liq + s[end:]

          # 5) Capture the prior market sample before replacing the current one, then use every
          # funding boundary's own deterministic interpolated mark.
          old_capture = "    const c = payload.candle;\n    const symbol = payload.symbol || payload.candle?.symbol || null;\n    const idx = Number.isFinite(payload.index) ? payload.index : this._latestCandleIndex + 1;\n    // clone\n"
          new_capture = "    const c = payload.candle;\n    const symbol = payload.symbol || payload.candle?.symbol || null;\n    const previousMarket = symbol ? this._marketBySymbol.get(symbol) : null;\n    const idx = Number.isFinite(payload.index) ? payload.index : this._latestCandleIndex + 1;\n    // clone\n"
          if old_capture not in s:
              raise SystemExit('onMarketCandle capture anchor not found')
          s = s.replace(old_capture, new_capture, 1)

          old_funding = """    // 5. Automatic funding evaluation at scheduled boundaries across the chronological interval\n    if (this._fundingSchedule && Number.isFinite(c.time)) {\n      const interval = this._fundingSchedule.intervalSec || (8 * 3600);\n      const origin = this._fundingSchedule.origin || 0;\n\n      if (this._lastFundingTimestamp == null) {\n        this._lastFundingTimestamp = c.time;\n      } else if (c.time > this._lastFundingTimestamp) {\n        const prevTime = this._lastFundingTimestamp;\n        let nextBoundary = origin + Math.floor((prevTime - origin) / interval + 1) * interval;\n        while (nextBoundary <= c.time) {\n          const rate = typeof this._fundingSchedule.rateProvider === 'function'\n            ? this._fundingSchedule.rateProvider(nextBoundary, symbol)\n            : (this._fundingSchedule.defaultRate ?? 0.0001);\n          this.applyFundingRate({ symbol, fundingRate: rate, timestamp: nextBoundary });\n          nextBoundary += interval;\n        }\n        this._lastFundingTimestamp = c.time;\n      }\n    }\n"""
          new_funding = """    // 5. Automatic funding evaluation at scheduled boundaries across the chronological interval.\n    // Each boundary is priced independently from the last known and current bar closes.\n    if (this._fundingSchedule && Number.isFinite(c.time)) {\n      const interval = this._fundingSchedule.intervalSec || (8 * 3600);\n      const origin = this._fundingSchedule.origin || 0;\n\n      if (this._lastFundingTimestamp == null) {\n        this._lastFundingTimestamp = c.time;\n      } else if (c.time > this._lastFundingTimestamp) {\n        const prevTime = this._lastFundingTimestamp;\n        let nextBoundary = origin + Math.floor((prevTime - origin) / interval + 1) * interval;\n        while (nextBoundary <= c.time) {\n          for (const [sym, pos] of this._positions.entries()) {\n            if (pos.openedAt != null && Number(pos.openedAt) > nextBoundary) continue;\n            const rate = typeof this._fundingSchedule.rateProvider === 'function'\n              ? this._fundingSchedule.rateProvider(nextBoundary, sym)\n              : (this._fundingSchedule.defaultRate ?? 0.0001);\n            const marketForSymbol = sym === symbol\n              ? { candle: previousMarket?.candle, timestamp: previousMarket?.timestamp }\n              : this._marketBySymbol.get(sym);\n            const mark = sym === symbol\n              ? this._fundingMarkPriceAt(sym, nextBoundary, marketForSymbol, c)\n              : (Number.isFinite(pos.currentPrice) ? pos.currentPrice : pos.entryPrice);\n            this.applyFundingRate({ symbol: sym, fundingRate: rate, timestamp: nextBoundary, markPrice: mark });\n          }\n          nextBoundary += interval;\n        }\n        this._lastFundingTimestamp = c.time;\n      }\n    }\n"""
          if old_funding not in s:
              raise SystemExit('Automatic funding block not found')
          s = s.replace(old_funding, new_funding, 1)

          # 6) Correct stale top-of-file execution comment.
          s = s.replace(
              " * Deterministic: market execution = close, limit execution = limitPrice with next-candle rule.\n",
              " * Deterministic research clock: market orders default to next-bar open; explicit IMMEDIATE_CLOSE is supported for manual execution.\n",
              1,
          )

          engine_path.write_text(s)

          # 7) Backtest result: distinguish all pending orders from terminal-bar pending orders.
          runner_path = Path('src/strategy/BacktestRunner.js')
          r = runner_path.read_text()
          old = """    const allOrders = this.engine.getOrders();\n    const pendingIntents = allOrders.filter(o => o.status === ORDER_STATUSES.PENDING);\n    return {\n      summary: {\n        ...this.engine.getBacktestSummary(),\n        unfilledTerminalOrders: pendingIntents.length,\n      },\n      trades: this.engine.getTrades(),\n      unfilledOrders: pendingIntents,\n"""
          new = """    const allOrders = this.engine.getOrders();\n    const pendingIntents = allOrders.filter(o => o.status === ORDER_STATUSES.PENDING);\n    const terminalIndex = this.engine._latestCandleIndex;\n    const terminalOrders = pendingIntents.filter(o => o.createdIndex === terminalIndex);\n    return {\n      summary: {\n        ...this.engine.getBacktestSummary(),\n        unfilledTerminalOrders: terminalOrders.length,\n      },\n      trades: this.engine.getTrades(),\n      unfilledOrders: pendingIntents,\n      unfilledTerminalOrders: terminalOrders,\n"""
          if old not in r:
              raise SystemExit('BacktestRunner results block not found')
          runner_path.write_text(r.replace(old, new, 1))
          PY

      - name: Add adversarial regression tests
        shell: bash
        run: |
          cat > tests/audit-hardening.test.js <<'EOF'
          import { describe, it, expect } from 'vitest';
          import { PaperTradingEngine, EXECUTION_TIMING } from '../src/trading/PaperTradingEngine.js';

          const candle = (time, open, high, low, close) => ({ time, open, high, low, close, volume: 1 });

          describe('Audited margin/funding hardening', () => {
            it('rejects a new entry when used cross-margin leaves insufficient available margin', () => {
              const e = new PaperTradingEngine({ startingBalance: 10000, feeRate: 0, marginRate: 0.1, maintMarginRate: 0.05, executionTiming: EXECUTION_TIMING.IMMEDIATE_CLOSE });
              e.onMarketCandle({ candle: candle(0, 100, 100, 100, 100), index: 0, symbol: 'BTCUSD' });
              expect(e.placeOrder({ symbol: 'BTCUSD', side: 'BUY', quantity: 90 }).success).toBe(true); // $9,000 IM
              e.onMarketCandle({ candle: candle(1, 50, 50, 50, 50), index: 1, symbol: 'ETHUSD' });
              const res = e.placeOrder({ symbol: 'ETHUSD', side: 'BUY', quantity: 200 }); // $10,000 notional -> $1,000 IM, exactly at available
              expect(res.success).toBe(true);
              e.onMarketCandle({ candle: candle(2, 50, 50, 50, 50), index: 2, symbol: 'SOLUSD' });
              const rejected = e.placeOrder({ symbol: 'SOLUSD', side: 'BUY', quantity: 1 });
              expect(rejected.success).toBe(false);
              expect(rejected.code).toBe('INSUFFICIENT_MARGIN');
            });

            it('funding uses the mark price at each historical funding boundary', () => {
              const e = new PaperTradingEngine({
                startingBalance: 10000,
                feeRate: 0,
                executionTiming: EXECUTION_TIMING.IMMEDIATE_CLOSE,
                fundingSchedule: { intervalSec: 28800, defaultRate: 0.001 },
              });
              e.onMarketCandle({ candle: candle(60, 100, 100, 100, 100), index: 0, symbol: 'BTCUSD' });
              e.placeOrder({ symbol: 'BTCUSD', side: 'BUY', quantity: 10 });
              e.onMarketCandle({ candle: candle(86460, 200, 200, 200, 200), index: 1, symbol: 'BTCUSD' });
              const h = e.getFundingHistory();
              expect(h).toHaveLength(3);
              expect(h.map(x => x.timestamp)).toEqual([28800, 57600, 86400]);
              expect(h[0].markPrice).toBeCloseTo(133.333333, 5);
              expect(h[1].markPrice).toBeCloseTo(166.666667, 5);
              expect(h[2].markPrice).toBeCloseTo(200, 5);
              expect(e.getAccountSnapshot().walletBalance).toBeCloseTo(9995, 8);
            });
          });
          EOF

      - name: Verify
        run: |
          npm ci
          npm test
          npm run build

      - name: Commit audited fixes
        shell: bash
        run: |
          rm -f .github/workflows/audit-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github/workflows/audit-fix.yml
          git diff --cached --check
          git commit -m "fix(accounting): audited margin admission, boundary marks, portfolio liquidation, and terminal order reporting"
          git push
