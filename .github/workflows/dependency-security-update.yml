name: Dependency security refresh

on:
  push:
    branches:
      - fix/dependency-security

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Refresh vulnerable dev dependencies
        run: npm install --save-dev vite@^6.4.3 vitest@^3.2.6
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependencies already refreshed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(deps): refresh vite and vitest security fixes"
          git push
