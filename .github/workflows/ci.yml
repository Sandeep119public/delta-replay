name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - 'refactor/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:architecture:graph
      - run: npm run test:architecture
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend pytest backend/tests -q
