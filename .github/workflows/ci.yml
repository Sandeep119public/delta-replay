name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - 'refactor/**'
      - 'fix/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: delta_replay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d delta_replay_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/delta_replay_test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:architecture:graph
      - run: npm run test:architecture
      - run: npm run test:ui-contracts
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend pytest backend/tests -q
      - name: Build backend container
        run: docker build --file backend/Dockerfile --tag delta-replay-api:ci .
