name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - 'refactor/**'
      - 'fix/**'
      - 'audit/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: delta_replay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d delta_replay_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/delta_replay_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:architecture:graph
      - run: npm run test:architecture
      - run: npm run test:ui-contracts
      - run: npm test
      - run: npm run build
      - name: Validate local Compose configuration
        run: docker compose -f docker-compose.v2.yml config --quiet
      - name: Build frontend container
        run: docker build --file frontend/Dockerfile --tag delta-replay-web:ci .
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python -m pip install -r backend/requirements.txt
      - name: Apply database migrations
        run: python backend/scripts/migrate.py
      - name: Verify database migrations are idempotent
        run: python backend/scripts/migrate.py
      - run: PYTHONPATH=backend pytest backend/tests -q
      - name: Build backend container
        run: docker build --file backend/Dockerfile --tag delta-replay-api:ci .
