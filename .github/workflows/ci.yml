name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - 'refactor/**'
      - 'fix/**'
      - 'audit/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check architecture graph
        run: npm run test:architecture:graph

      - name: Check architecture boundaries
        run: npm run test:architecture

      - name: Check UI contracts
        run: npm run test:ui-contracts

      - name: Run frontend tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Upload validated Pages artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: ./dist

  backend:
    name: Backend verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: delta_replay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d delta_replay_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/delta_replay_test
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Apply database migrations
        run: python backend/scripts/migrate.py

      - name: Verify database migrations are idempotent
        run: python backend/scripts/migrate.py

      - name: Run backend tests
        run: PYTHONPATH=backend pytest backend/tests -q

  integration:
    name: Full-stack integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Validate Compose configuration
        run: docker compose -f docker-compose.v2.yml config --quiet

      - name: Build and start the complete stack
        run: docker compose -f docker-compose.v2.yml up --build -d

      - name: Apply migrations inside the real API container
        run: docker compose -f docker-compose.v2.yml exec -T api python backend/scripts/migrate.py

      - name: Verify migrations are idempotent in the real stack
        run: docker compose -f docker-compose.v2.yml exec -T api python backend/scripts/migrate.py

      - name: Verify API health
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Verify frontend is reachable
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Show service state on failure
        if: ${{ failure() }}
        run: docker compose -f docker-compose.v2.yml ps && docker compose -f docker-compose.v2.yml logs --no-color

      - name: Tear down integration stack
        if: ${{ always() }}
        run: docker compose -f docker-compose.v2.yml down --volumes --remove-orphans

  deploy:
    name: Deploy validated frontend
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    needs: [frontend, backend, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
