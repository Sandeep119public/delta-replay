services:
  postgres:
    image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: delta_replay
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d delta_replay"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - delta-replay-postgres:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "backend/scripts/migrate.py"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/delta_replay
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/delta_replay
      CORS_ORIGINS: http://localhost:4173,http://localhost:5173
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4173:4173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  delta-replay-postgres:
