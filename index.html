<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Delta Replay</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <!-- TOP BAR -->
    <header class="topbar">
      <div class="topbar-left">
        <h1 class="logo">DELTA REPLAY</h1>
        <span class="phase-badge">PHASE 1 — HISTORICAL REPLAY</span>
      </div>
      <div class="topbar-center">
        <div class="selector-group">
          <label for="symbol-select">Symbol</label>
          <select id="symbol-select"></select>
        </div>
        <div class="selector-group">
          <label for="timeframe-select">Timeframe</label>
          <select id="timeframe-select"></select>
        </div>
        <div class="selector-group">
          <label for="from-date">From (UTC)</label>
          <div class="datetime-group">
            <input type="date" id="from-date" />
            <input type="time" id="from-time" step="60" />
          </div>
        </div>
        <div class="selector-group">
          <label for="to-date">To (UTC)</label>
          <div class="datetime-group">
            <input type="date" id="to-date" />
            <input type="time" id="to-time" step="60" />
          </div>
        </div>
        <button id="load-btn" class="btn btn-primary">LOAD DATA</button>
      </div>
      <div class="topbar-right">
        <span id="data-status" class="data-status">No data loaded</span>
      </div>
    </header>

    <!-- MODE BANNER -->
    <div id="mode-banner" class="mode-banner mode-idle">
      <span id="mode-indicator" class="mode-indicator">NO DATA LOADED</span>
      <span id="progress-panel" class="progress-panel hidden">
        <span id="progress-text">0 / 0</span>
        <span id="progress-pct">0%</span>
        <span id="market-time" class="market-time">—</span>
      </span>
      <span id="market-time-full" class="market-time-full">CURRENT MARKET TIME: —</span>
    </div>

    <!-- MAIN CHART AREA -->
    <main class="main">
      <div id="chart-container" class="chart-container"></div>
      <div id="chart-overlay" class="chart-overlay hidden">
        <p id="overlay-text"></p>
      </div>
    </main>

    <!-- TIMELINE -->
    <section class="timeline-section">
      <div class="timeline-header">
        <span id="timeline-start-label">—</span>
        <span id="timeline-current-label" class="timeline-current">—</span>
        <span id="timeline-end-label">—</span>
      </div>
      <div class="timeline-track-wrap">
        <input type="range" id="timeline-slider" min="0" max="100" value="0" disabled />
        <div class="timeline-meta">
          <span id="timeline-index-label">0 / 0</span>
          <span id="timeline-time-label">—</span>
        </div>
      </div>
      <div class="timeline-start-controls">
        <div class="start-info">
          <span id="start-index-label">Replay start: 0</span>
          <span id="start-time-label" class="start-time-label">—</span>
        </div>
        <div class="jump-group">
          <label for="jump-date" class="jump-label">Jump to (UTC)</label>
          <div class="datetime-group jump-datetime">
            <input type="date" id="jump-date" />
            <input type="time" id="jump-time" step="60" />
            <button id="jump-btn" class="btn btn-secondary">JUMP</button>
          </div>
          <span id="jump-error" class="jump-error hidden"></span>
        </div>
        <button id="start-replay-btn" class="btn btn-accent" disabled>START REPLAY</button>
      </div>
    </section>

    <!-- REPLAY CONTROLS -->
    <section class="controls-section">
      <div class="controls-row">
        <button id="btn-reset" class="btn" disabled title="R (Reset)">RESET</button>
        <button id="btn-play" class="btn" disabled title="Space (Play/Pause)">PLAY</button>
        <button id="btn-pause" class="btn hidden" disabled>PAUSE</button>
        <button id="btn-step" class="btn" disabled title="→ (Step)">STEP</button>
        <div class="speed-group">
          <label for="speed-select">Speed</label>
          <select id="speed-select" disabled>
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
            <option value="5">5x</option>
            <option value="10">10x</option>
          </select>
        </div>
        <span id="replay-status" class="replay-status">idle</span>
      </div>
      <p class="shortcuts-hint">Space: Play/Pause &nbsp;|&nbsp; → Step &nbsp;|&nbsp; R: Reset</p>
      <div id="error-banner" class="error-banner hidden"></div>
    </section>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
