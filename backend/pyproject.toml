[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "delta-replay-api"
version = "2.3.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141,<1",
  "uvicorn[standard]>=0.53.0,<1",
  "pydantic>=2.13,<3",
  "httpx>=0.28.1,<1",
  "python-multipart>=0.0.32,<1",
  "psycopg[binary]>=3.3,<4",
  "pyarrow>=21,<23",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1,<10"]
